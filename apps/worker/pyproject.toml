[project]
name = "agent-voice-worker"
version = "0.1.0"
description = "LiveKit Agents worker for agent-voice: a full-duplex voice action layer for tool-using AI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"

dependencies = [
    "livekit-agents[openai]~=1.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_voice_worker"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Instruction prose and long test payloads are clearer unwrapped.
    "E501",
]

[tool.mypy]
# Matches .python-version (3.12), the interpreter uv actually provisions;
# pinning 3.11 here made mypy parse numpy's PEP 695 stub as a syntax error
# while just following pytest's internals, unrelated to our own code.
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]
# The LiveKit plugin surface is partially untyped; do not fail the build on that.
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
